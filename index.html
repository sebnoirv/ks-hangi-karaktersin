<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ŞEBOLOG - KS'de Hangi Karaktersin?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        body { font-family: 'Montserrat', sans-serif; background: #f0f2f5; }
        .option-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
        .gradient-text { background: linear-gradient(45deg, #ff416c, #ff4b2b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .custom-button { background: linear-gradient(45deg, #ff416c, #ff4b2b); transition: 0.3s; }
        .custom-button:hover { opacity: 0.9; transform: scale(1.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const questions = [
            { question: "Sabah uyandığında ilk düşüncen ne olur?", options: [{ text: "Beş dakika daha... Yoksa dünya batar.", character: "kaos" }, { text: "Bugün hangi sorunu çözsem?", character: "lider" }, { text: "Telefonum nerede?", character: "populer" }, { text: "Neden uyandım ki?", character: "filozof" }] },
            { question: "Arkadaş grubunla plan yaparken rolün ne?", options: [{ text: "Planı ben yaparım.", character: "lider" }, { text: "Gidince haber verin.", character: "kaos" }, { text: "En iyi mekanı ben bilirim.", character: "populer" }, { text: "Analiz ederim.", character: "filozof" }] }
        ];

        const results = {
            lider: { title: "Orijinal Lider!", desc: "Sen tam bir KS efsanesisin.", emoji: "👑" },
            kaos: { title: "Kaosun Efendisi!", desc: "Nerede karışıklık orada sen!", emoji: "🔥" },
            populer: { title: "Sosyal Medya İkonu!", desc: "Herkes seni tanıyor!", emoji: "✨" },
            filozof: { title: "Gizemli Gözlemci!", desc: "Derin düşüncelerinle şaşırtıyorsun.", emoji: "🧠" }
        };

        function App() {
            const [step, setStep] = useState('start');
            const [finalResult, setFinalResult] = useState(results.lider);
            
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <h1 className="text-5xl font-black gradient-text mb-8">ŞEBOLOG</h1>
                    <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 text-center">
                        {step === 'start' && (
                            <>
                                <h2 className="text-2xl font-bold mb-4">KS'de Hangi Karaktersin?</h2>
                                <button onClick={() => setStep('result')} className="custom-button text-white py-3 px-8 rounded-full">Teste Başla!</button>
                            </>
                        )}
                        {step === 'result' && (
                            <>
                                <div className="text-6xl mb-4">{finalResult.emoji}</div>
                                <h2 className="text-3xl font-bold mb-2">{finalResult.title}</h2>
                                <p>{finalResult.desc}</p>
                            </>
                        )}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
