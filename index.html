<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KS'de Hangi Karaktersin?</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#fff1f7,#f3edff);color:#29232d}
.wrap{max-width:720px;margin:auto;padding:18px}
.card{background:#fff;border-radius:25px;padding:25px;box-shadow:0 12px 35px #00000012;margin-top:20px}
h1{font-size:31px;text-align:center;margin:4px 0 8px}
.sub{text-align:center;color:#777;line-height:1.5}
button{width:100%;border:0;border-radius:15px;padding:15px;background:#d946ef;color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:12px}
.progress{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin:5px 0 24px}
.bar{height:100%;width:0;background:#d946ef;transition:.25s}
.q{font-size:21px;font-weight:750;line-height:1.4;margin-bottom:16px}
.opt{display:block;border:2px solid #eee;border-radius:15px;padding:14px;margin:10px 0;cursor:pointer;line-height:1.35}
.opt:hover{border-color:#d946ef;background:#fff8ff}
.opt input{margin-right:8px}
.result{text-align:center}
.emoji{font-size:65px}
.result h2{font-size:30px;margin:8px 0}
.result p{color:#555;line-height:1.6}
.small{font-size:13px;color:#999;text-align:center;margin-top:16px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<section class="card" id="intro">
<h1>💅 KS'de Hangi Karaktersin?</h1>
<p class="sub">15 soruda KS'deki karakterini keşfet. Cevaplarını seç, sonucu gör. 😭</p>
<button onclick="start()">Teste Başla</button>
<p class="small">15 soru • 4 karakter</p>
</section>

<section class="card hidden" id="quiz">
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="question"></div>
<button onclick="next()">Devam Et →</button>
</section>

<section class="card result hidden" id="result"></section>
</div>

<script>
const questions=[["KS'de en çok hangi tür sorular ilgini çeker?", ['Eğlenceli ve komik olanlar', 'Günlük hayatla ilgili olanlar', 'Bilgi ve kültür soruları', 'İnsanların fikirlerini merak ettirenler']], ['Bir soruda komik bir cevap gördün.', ['Ben daha komiğini yazmaya çalışırım.', 'Cevabı okuyup güler geçerim.', 'Ben de kendi yorumumu bırakırım.', 'Diğer cevaplara da bakarım.']], ['Sana göre iyi bir KS cevabı nasıl olmalı?', ['Kısa ve net', 'Komik ve yaratıcı', 'Bilgili ve açıklayıcı', 'Samimi ve doğal']], ['Bir soru sana “bunu kesin cevaplamalıyım” dedirtti.', ['Hemen cevaplarım.', 'İçimden cevaplarım, sonra vazgeçerim.', 'Cevabı biraz süslerim.', 'Önce diğer cevaplara göz atarım.']], ["KS'de bir konuda yanlış bilgi gördün.", ['Doğrusunu söylerim.', 'Kaynağı varsa paylaşırım.', 'Hiç bulaşmam.', '“Arkadaşlar sakin” diye girerim. 😭']], ['Bir soruya cevap verirken mizah seviyen?', ['Hafif dokundururum.', 'Fırsatını bulursam şaka yaparım.', 'Ciddi cevap veririm.', 'Şaka yapacağım diye sorunun kendisini unuturum.']], ["KS'de bir soru gördün ve kimsenin doğru düzgün cevap vermediğini fark ettin.", ['Ben cevaplarım.', '“Bunu da mı ben cevaplayacağım?” derim.', 'Bildiğim kadarıyla yardımcı olurum.', 'Bir şeyler yazıp ortamı hareketlendiririm.']], ["Sence KS'de en güzel şey ne?", ['Farklı insanların fikirlerini görmek', 'Komik cevaplara denk gelmek', 'Yeni şeyler öğrenmek', 'Hiç tanımadığın insanların hikâyelerini okumak']], ['Bir soruya cevap verirken kelime sayın genelde nasıl?', ['Birkaç kelime yeter.', 'Orta karar.', 'Konuya göre değişir.', 'Başladığımda nerede duracağımı ben de bilmiyorum. 😭']], ['Bir soruda çok farklı cevaplar gördün.', ['“İnsanlar gerçekten çok farklı” derim.', 'En komik olanları ararım.', 'Kendi cevabımı yazar geçerim.', 'Hepsini okumaya başlarım.']], ["KS'de bir soru seni güldürdü.", ['Cevap yazmadan duramam.', 'Sadece güler geçerim.', 'Ben de esprili bir cevap veririm.', 'Cevaplara bakıp daha çok gülerim.']], ['Bir soru tamamen senin ilgi alanına girdi.', ['Bildiğim ne varsa anlatırım.', 'Kısa bir cevap veririm.', 'Konuya göre birkaç bilgi eklerim.', '“Sonunda benim sorum geldi” derim. 😭']], ["KS'de seni en çok hangisi anlatıyor?", ['Her şeye bir yorumum vardır.', 'Daha çok okuyup izlerim.', 'Mizah yapmadan duramam.', 'Bildiğim konularda ortaya çıkarım.']], ['Bir soruda kendi cevabını verdikten sonra…', ['Çıkar giderim.', 'Diğer cevaplara da bakarım.', 'Komik bir cevap gelirse onu da okurum.', '“Acaba başkaları ne demiş?” diye devam ederim.']], ["KS'de bir günlüğüne moderatör olsan ilk ne yapardın?", ['Herkese birer çay dağıtırdım. ☕', 'Komik cevaplar için ayrı bir ödül koyardım.', 'En ilginç soruları öne çıkarırdım.', 'Hiçbir şey yapmaz, yetkiyi kötüye kullanmadan geri verirdim. 😭']]];
const mapping=[['Mizahçı', 'Gözlemci', 'Bilgi Avcısı', 'Yorumcu'], ['Mizahçı', 'Gözlemci', 'Yorumcu', 'Bilgi Avcısı'], ['Yorumcu', 'Mizahçı', 'Bilgi Avcısı', 'Gözlemci'], ['Yorumcu', 'Gözlemci', 'Mizahçı', 'Bilgi Avcısı'], ['Bilgi Avcısı', 'Bilgi Avcısı', 'Gözlemci', 'Mizahçı'], ['Mizahçı', 'Mizahçı', 'Bilgi Avcısı', 'Yorumcu'], ['Yorumcu', 'Gözlemci', 'Bilgi Avcısı', 'Mizahçı'], ['Gözlemci', 'Mizahçı', 'Bilgi Avcısı', 'Yorumcu'], ['Yorumcu', 'Yorumcu', 'Gözlemci', 'Mizahçı'], ['Gözlemci', 'Mizahçı', 'Yorumcu', 'Bilgi Avcısı'], ['Mizahçı', 'Gözlemci', 'Mizahçı', 'Mizahçı'], ['Bilgi Avcısı', 'Yorumcu', 'Bilgi Avcısı', 'Mizahçı'], ['Yorumcu', 'Gözlemci', 'Mizahçı', 'Bilgi Avcısı'], ['Yorumcu', 'Gözlemci', 'Mizahçı', 'Gözlemci'], ['Yorumcu', 'Mizahçı', 'Bilgi Avcısı', 'Gözlemci']];
const types={'Yorumcu': ('💬', "Her konuda söyleyecek bir iki cümlen mutlaka var. KS'ye girince sessiz kalmak sana pek göre değil; fikrini bırakıp çıkmayı seviyorsun."), 'Mizahçı': ('😂', "KS'nin komik tarafını yakalayanlardansın. En sıradan sorudan bile eğlence çıkarabilecek bir cevabın hazır olabilir."), 'Gözlemci': ('👀', 'Her şeyi fark eden ama her şeye atlamayan taraftasın. Cevapları, insanların farklı bakışlarını ve küçük ayrıntıları seviyorsun.'), 'Bilgi Avcısı': ('🧠', 'Öğrenmeyi ve bildiğin şeyi paylaşmayı seviyorsun. KS senin için sadece vakit geçirmek değil, arada bir yeni bir şey kapmak için de güzel bir yer.')};
let index=0, scores={};

function start(){
 document.getElementById('intro').classList.add('hidden');
 document.getElementById('quiz').classList.remove('hidden');
 render();
}
function render(){
 const [text,opts]=questions[index];
 document.getElementById('bar').style.width=(index/questions.length*100)+'%';
 document.getElementById('question').innerHTML=
 '<div class="q">'+(index+1)+'. '+text+'</div>'+
 opts.map((o,n)=>'<label class="opt"><input type="radio" name="answer" value="'+n+'"> '+o+'</label>').join('');
}
function next(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Bir seçenek seç bakalım 😭');return;}
 const type=mapping[index][Number(selected.value)];
 scores[type]=(scores[type]||0)+1;
 index++;
 if(index<questions.length) render(); else finish();
}
function finish(){
 const winner=Object.keys(scores).sort((a,b)=>(scores[b]||0)-(scores[a]||0))[0];
 const [emoji,text]=types[winner];
 document.getElementById('quiz').classList.add('hidden');
 const r=document.getElementById('result');
 r.classList.remove('hidden');
 r.innerHTML='<div class="emoji">'+emoji+'</div><h2>'+winner+'</h2><p>'+text+'</p>'+
 '<button onclick="location.reload()">Tekrar Dene 🔄</button>'+
 '<p class="small">Sonuç: '+scores[winner]+' puan</p>';
}
</script>
</body>
</html>
