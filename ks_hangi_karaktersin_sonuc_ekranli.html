<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KS'de Hangi Karaktersin?</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7eef5,#eee8f8);font-family:Inter,Arial,sans-serif;color:#29232d}
.wrap{max-width:760px;margin:0 auto;padding:22px 14px 45px}
.hero{background:#29232d;color:white;border-radius:28px;padding:30px 24px;text-align:center;box-shadow:0 15px 40px #0002}
.badge{display:inline-block;background:#ffffff18;border:1px solid #ffffff30;padding:7px 12px;border-radius:30px;font-size:12px;letter-spacing:.4px}
h1{font-size:34px;margin:15px 0 8px}.hero p{margin:0;color:#ddd;line-height:1.5}
.progress{height:7px;background:#ffffff20;border-radius:20px;margin-top:22px;overflow:hidden}.bar{height:100%;width:0;background:white;transition:.3s}
.question{display:none;background:#fff;border-radius:24px;padding:24px;margin-top:18px;box-shadow:0 8px 25px #0000000d}
.question.active{display:block}.num{font-size:13px;color:#8d748d;font-weight:bold}.question h2{font-size:22px;line-height:1.35;margin:10px 0 18px}
.option{display:flex;align-items:flex-start;gap:12px;padding:15px;border:1.5px solid #e7e1e8;border-radius:15px;margin:10px 0;cursor:pointer;transition:.2s;background:#fff}
.option:hover{border-color:#8d748d;background:#fbf8fc}.option input{accent-color:#29232d;margin-top:3px}.option span{line-height:1.4}
.nav{display:flex;gap:10px;margin-top:16px}.nav button{flex:1;padding:14px;border:0;border-radius:15px;font-size:15px;font-weight:700;cursor:pointer}.back{background:#eee9ef}.next{background:#29232d;color:white}
#result{display:none}.resultCard{background:#fff;border-radius:28px;padding:30px 23px;text-align:center;margin-top:20px;box-shadow:0 12px 35px #0002}
.emoji{font-size:52px}.resultCard h2{font-size:28px;margin:10px 0}.resultCard p{line-height:1.65;color:#555}.tag{display:inline-block;padding:8px 12px;border-radius:30px;background:#f1ebf3;color:#634d66;font-size:13px;margin:5px}
.share{margin-top:18px;width:100%;padding:15px;border:0;border-radius:15px;background:#29232d;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
.note{text-align:center;color:#8b818c;font-size:12px;margin-top:15px}
 .you{margin:24px 0 8px;text-align:left;border-top:1px solid #eee;padding-top:18px}.you h3{margin:0 0 12px;font-size:18px}.trait{padding:9px 0;color:#4d4650;line-height:1.4}.secondary{background:#eee9ef!important;color:#29232d!important;margin-top:9px}.resultTags{margin-top:8px} </style>
</head>
<body>
<div class="wrap">
<section class="hero">
<span class="badge">KS EĞLENCE TESTİ</span>
<h1>KS'de Hangi Karaktersin?</h1>
<p>12 soruyu cevapla. Cevaplarına göre KS'deki karakterini öğren. 👀</p>
<div class="progress"><div class="bar" id="bar"></div></div>
</section>
<div id="quiz"></div>
<div id="result"></div>
<p class="note">Bu test tamamen eğlence amaçlıdır. Sonuçlar cevaplarına göre oluşturulur.</p>
</div>

<script>
const types={
A:{emoji:"🕵️",name:"Sessiz Stalker",desc:"Sen ortalığı ayağa kaldırmadan her şeyden haberdar olanlardansın. Kim ne yazmış, kim kime cevap vermiş, hangi tartışma nerede çıkmış… Senin gözünden pek bir şey kaçmıyor. Çoğu zaman yorum yapmaktan çok gözlemlemeyi seçiyorsun; ama konuştuğunda da 'Bu nereden çıktı şimdi?' dedirtiyorsun.",tags:["gözlemci","meraklı","sessiz güç"]},
B:{emoji:"🔥",name:"Tartışma Ateşleyicisi",desc:"Senin olduğun yerde sıradan bir soru uzun süre sıradan kalamıyor. Bir cümlenle tartışma başlayabilir, masum bir yorumun 80 cevaba dönüşebilir. Üstelik çoğu zaman olay çıkarmaya çalışmıyorsun; sadece fikrini söylüyorsun… (!)",tags:["iddialı","direkt","kaos mıknatısı"]},
C:{emoji:"🌙",name:"Gece Kuşu",desc:"KS senin için biraz da gece mesaisi. Gündüz hayat devam ederken sen ortalarda görünmeyebilirsin; ama gece herkes uyurken bir anda çevrimiçi olup hayatın en alakasız sorusunu sorabilirsin. Saat 03.17'de 'Sizce insanlar neden değişir?' diye soru açma potansiyelin yüksek.",tags:["gececi","spontane","uykusuz"]},
D:{emoji:"💅",name:"Cool Takılan",desc:"Dışarıdan bakınca hiçbir şeyi umursamayan, rahat ve cool bir profil çiziyorsun. Ama kabul edelim: Bazen 'hiç umurumda değil' dedikten sonra konuyu zihninde 47 kez tekrar ediyorsun. 😌 Yine de bunu kimseye belli etmiyorsun.",tags:["cool","gururlu","hafif overthinker"]},
E:{emoji:"🧠",name:"Site Bilgesi",desc:"Her konuda bir fikrin var ve daha önemlisi, fikrini destekleyecek bir paragrafın da hazır. Bir soru sorulduğunda 'bence' deyip geçmiyorsun; konuyu kökünden ele alıyorsun. Bazen insanlar cevabını okumaya başladığında soruyu neden sorduğunu unutuyor.",tags:["bilgili","detaycı","uzun cevap"]},
F:{emoji:"😂",name:"Kaosun Kendisi",desc:"Sen KS'ye sadece soru cevaplamaya gelmiyorsun; biraz da eğlenmeye geliyorsun. En ciddi konunun içine bile bir espri sıkıştırabilirsin. Bir anda kendini hiç ilgilenmediğin bir tartışmanın ortasında bulman da oldukça mümkün. Senin olduğu yerde 'normal bir gün' kavramı biraz şüpheli.",tags:["komik","spontane","kaotik"]},
G:{emoji:"👻",name:"Hayalet Üye",desc:"Uzun süre görünmezsin. Kimse senden haber alamaz. Sonra bir gün ortaya çıkıp tek bir soru veya cevap bırakırsın ve herkes 'Bu kimdi ya?' diye bakar. Aktif olmaman, olup bitenden habersiz olduğun anlamına gelmiyor.",tags:["gizemli","aralıklı","sessiz takipçi"]},
H:{emoji:"💘",name:"Aşk Dedektifi",desc:"İlişki sorularında radarların otomatik açılıyor. 'Sizce benden hoşlanıyor mu?' sorusunun içindeki tek bir kelimeden bile 14 farklı ihtimal çıkarabilirsin. Bazen karşı tarafın kendisinin fark etmediği duyguları bile analiz ettiğin oluyor.",tags:["analitik","romantik","dedektif"]},
I:{emoji:"🗯️",name:"Tek Cümlelik Efsane",desc:"Sayfalarca yazılan bir soruya üç kelimeyle cevap verip bütün olayı özetleyebilirsin. Gereksiz uzatmalara tahammülün yok. Bazen cevabın o kadar kısa olur ki insanlar 'devamı nerede?' diye bakar. Ama sen zaten söyleyeceğini söylemişsindir.",tags:["kısa-net","pratik","lafı uzatmayan"]}
};

const qs=[
["KS'ye girince ilk yaptığın şey hangisi?",["A","B","C","D","E","F","G","H","I"],[
"Yeni sorulara bakarım, ilgimi çeken olursa dalarım.",
"Bir bakayım derken kendimi 40 dakika sonra bulurum.",
"Önce bildirimlerime bakarım, sonra ne var ne yok gezerim.",
"Bugün sakin takılacağım derim, ilk tartışmada kendimi bulurum.",
"İlginç bir soru görürsem cevabı kafamda yazmaya başlarım.",
"Rastgele bir soru açarım; bazen asıl eğlence oradan çıkıyor.",
"Uzun zamandır girmediysem önce sessizce ortama bakarım.",
"İlişki sorusu gördüysem diğerlerine bakmam biraz zor.",
"Sadece iki dakika bakıp çıkacağım… meşhur son sözüm."
]],
["Bir soruya cevap verirken seni en iyi hangisi anlatıyor?",["E","I","F","B","A","D","H","C","G"],[
"Anlatacaksam hakkını veririm, kısa geçeceksem de kısa geçerim.",
"Ne demek istediğimi uzatmadan söyleyip geçerim.",
"Cevabın içine küçük bir şaka sıkıştırmadan duramam.",
"Fikrimi söylerim; katılmayan da nedenini söylesin.",
"Önce soruyu ve soran kişinin ne demek istediğini anlamaya çalışırım.",
"Yazdığımı üç kere silip 'neyse' deyip tekrar yazarım.",
"Altındaki ilişki meselesini çözmeden rahat edemem.",
"Gece aklıma geldiyse saat kaç olduğuna bakmadan yazarım.",
"Bazen sadece okuyup geçerim; her şeye dahil olmak zorunda değilim."
]],
["Bir tartışmada karşı taraf sana hak verdi. Ne yaparsın?",["B","D","F","I","E","A","H","C","G"],[
"İçimden 'Ben zaten bunu anlatmaya çalışıyordum' derim.",
"Tamamdır deyip konuyu kapatırım.",
"Biraz şaka yapıp ortamı yumuşatırım.",
"Tamam deyip ekranı kapatırım; uzatmaya gerek yok.",
"Madem konu netleşti, neden haklı olduğumu bir kez daha açıklarım.",
"Şimdi hak verdi ama neden fikrini değiştirdiğini merak ederim.",
"Asıl meselenin çözüldüğünden emin olmaya çalışırım.",
"Gece tekrar düşünür, aklıma yeni bir şey gelirse geri dönerim.",
"Hiçbir şey yapmam; tartışmanın bitmesi yeter."
]],
["Hangisi seni KS'de daha kolay bir soruya tıklatır?",["H","F","E","A","C","D","B","G","I"],[
"'Bunu yaşayan sadece ben miyim?' tarzı ilişki soruları.",
"Absürt ama gerçekten merak edilen sorular.",
"Bir şey öğreten veya düşündüren sorular.",
"Başlığı görünce 'Burada ne olmuş?' dedirten sorular.",
"Gece karşıma çıkan, normalde gündüz sormayacağım şeyler.",
"İnsan davranışlarını sorgulayan sorular.",
"İnsanların ikiye bölüneceğini bildiğim konular.",
"Uzun zamandır cevap bekleyen bir soru dikkatimi çeker.",
"Cevabı kafamda hazır olan sorular."
]],
["Birinin cevabı sana göre tamamen yanlış. Ne yaparsın?",["B","E","I","F","A","D","H","C","G"],[
"Katılmadığımı söylerim, gerisi karşı tarafa kalmış.",
"Nerede yanlış düşündüğünü sakin sakin anlatırım.",
"Bir cümleyle düzeltir, geçerim.",
"Yanıtın içine hafif bir mizah bırakmadan duramam.",
"Önce neden öyle düşündüğünü anlamaya çalışırım.",
"Görürüm ama her gördüğüme cevap vermem.",
"Yanlışlığından çok, bu fikrin arkasında ne olduğunu merak ederim.",
"Gece tekrar okuyup cevap vermek isteyebilirim.",
"Hiç uğraşmam; herkesin fikri kendine."
]],
["Saat 02.00'de hâlâ KS'desin. Büyük ihtimalle neden?",["C","A","H","F","D","E","B","G","I"],[
"Uyku tutmadı, burada oyalanıyorum.",
"Sadece bakıp çıkacaktım ama yine kaldım.",
"Bir ilişki sorusunun cevabını kafamda çözüyorum.",
"Canım sıkıldı; biraz ortamın nabzını yokluyorum.",
"Uyumuyorum çünkü yarın erken kalkacak olmanın stresini de yaşamıyorum.",
"Bir soruya cevap yazıyorum ve düşündüğümden uzun sürdü.",
"Bir tartışmaya son bir şey söyleyip çıkacağım…",
"Uzun süre girmemiştim, bir anda gece aklıma geldi.",
"Bir şeye cevap verip çıkacağım; gerçekten."
]],
["Bir soruya uzun uzun cevap yazdın. Karşılığında sadece 'tm' geldi. Ne yaparsın?",["E","D","F","I","A","B","H","C","G"],[
"İçimden 'Ben bunu niye bu kadar anlattım?' derim.",
"Hiç belli etmem, sonuçta cevap vermiş.",
"Gülerim; emeğimin karşılığı iki harfmiş demek.",
"Ben de bir daha bu kadar uzun yazmamaya karar veririm… muhtemelen.",
"Yazdıklarımın okunup okunmadığını sorgularım.",
"Bir dahaki sefere daha kısa ve net yazarım.",
"'Tm' deyip ne kastettiğini bile analiz etmeye başlarım.",
"Gece aklıma geldikçe o cevabı hatırlarım.",
"Bir 'rica ederim' beklemiyordum zaten."
]],
["Bir soru beklenmedik şekilde 300 cevap aldı. Sen ne yaparsın?",["A","F","B","E","H","C","D","G","I"],[
"Kim ne demiş diye cevapları okumaya başlarım.",
"Kaos büyüdüyse biraz izlemek eğlenceli olabilir.",
"En hararetli yere bir şey yazmadan duramam.",
"Aradan gerçekten işe yarayan birkaç cevap çıkmış mı diye bakarım.",
"İlişki sorusuysa yorumlarda kim kime ne demiş özellikle ilgimi çeker.",
"Gece tekrar dönüp kalan cevaplara bakarım.",
"Bir süre okuyup 'tamam, yeter' deyip çıkarım.",
"Muhtemelen ben çok sonra görürüm.",
"Sonlara doğru kısa bir cevap bırakıp çıkarım."
]],
["Seni en çok hangi cevap türü yoruyor?",["I","B","E","A","D","F","H","C","G"],[
"Basit bir şeyi anlatmak için roman yazılması.",
"Fikirden çok kişiye saldırılması.",
"Yanlış bilginin kesin doğruymuş gibi anlatılması.",
"Ne demek istediği belli olmayan cevaplar.",
"Her şeyin gereksiz yere büyütülmesi.",
"Espri yapılabilecek yerde aşırı ciddiyet.",
"İlişki sorusunun içinde kimsenin asıl soruyu konuşmaması.",
"Gece okuyunca daha da anlamsız gelen uzun tartışmalar.",
"Bir soruya kimsenin cevap vermemesi."
]],
["Biri sana 'Sen burada çok aktifsin' dedi. Tepkin?",["D","C","A","E","F","B","H","G","I"],[
"Yok ya, denk geliyorum sadece.",
"Gece daha çok giriyorum, o yüzden olabilir.",
"Ben daha çok okuyorum aslında.",
"İlginç soru olunca cevaplıyorum, hepsi bu.",
"Aktif değilim, sadece canım sıkılınca eğleniyorum.",
"Bir şey söyleyeceksem söylerim, bunda ne var?",
"İlişki soruları varsa biraz daha fazla takılıyorum olabilir.",
"Bazen aylarca girmiyorum, sonra bir gün bütün gün buradayım.",
"İşim düşünce giriyorum; yoksa hayat devam ediyor."
]],
["KS'de bir gününü tek kelimeyle anlatacak olsan?",["G","F","C","E","A","H","B","D","I"],[
"Kayboluş.",
"Kaos.",
"Gece.",
"Analiz.",
"Gözlem.",
"Dedektiflik.",
"Tartışma.",
"Coolluk.",
"Pratiklik."
]],
["Son olarak, hangisi sana daha yakın?",["A","B","C","D","E","F","G","H","I"],[
"Her şeyi fark ederim ama her şeyi söylemem.",
"Bir fikrim varsa söylerim; gerisini herkes kendi bilir.",
"Gece daha yaratıcıyım, bunu kabul ediyorum.",
"Umursamıyorum… yani, çoğunlukla.",
"Bir konu açıldıysa biraz detayına inerim.",
"Ciddiyetin de bir sınırı var.",
"Beni uzun süre görmezsin, sonra bir anda buradayım.",
"İnsan ilişkileri gereğinden fazla ilginç.",
"Az kelimeyle çok şey anlatmak mümkün."
]]
];

let index=0,answers=[];
const quiz=document.getElementById("quiz"),bar=document.getElementById("bar");
qs.forEach((q,i)=>{
 let sec=document.createElement("section");sec.className="question"+(i===0?" active":"");sec.id="q"+i;
 sec.innerHTML=`<div class="num">SORU ${i+1} / ${qs.length}</div><h2>${q[0]}</h2>`;
 q[1].forEach((type,j)=>sec.innerHTML+=`<label class="option"><input type="radio" name="q${i}" value="${type}"><span>${q[2][j]}</span></label>`);
 sec.innerHTML+=`<div class="nav"><button class="back" onclick="go(-1)" ${i===0?"style='visibility:hidden'":""}>← Geri</button><button class="next" onclick="go(1)">${i===qs.length-1?"Sonucu Gör ✨":"Devam Et →"}</button></div>`;
 quiz.appendChild(sec);
});
function go(dir){
 const chosen=document.querySelector(`input[name="q${index}"]:checked`);
 if(dir===1&&!chosen){alert("Önce bir seçenek seç 😌");return}
 if(chosen)answers[index]=chosen.value;
 document.getElementById("q"+index).classList.remove("active");
 index+=dir;
 if(index>=qs.length){showResult();return}
 document.getElementById("q"+index).classList.add("active");
 bar.style.width=(index/(qs.length))*100+"%";
 window.scrollTo({top:0,behavior:"smooth"});
}
function showResult(){
 let count={};Object.keys(types).forEach(k=>count[k]=0);answers.forEach(x=>count[x]++);
 let max=Math.max(...Object.values(count)), winners=Object.keys(count).filter(k=>count[k]===max);
 window.currentResultKey=winners[Math.floor(Math.random()*winners.length)]; let key=window.currentResultKey,r=types[key];
 quiz.style.display="none";document.querySelector(".hero").style.display="none";
 document.getElementById("result").style.display="block";
 const traits={A:["Her şeyi fark eder ama her şeyi söylemez.","Sessizce okuyup ortamın nabzını tutar.","Gereksiz tartışmaya girmeden de her şeyden haberdar olur."],B:["Bir fikri varsa saklamaz.","Tartışmayı kişiselleştirmeden fikrinin arkasında durur.","“Ben sadece fikrimi söyledim” cümlesini kullanma ihtimali yüksektir."],C:["Gece saatlerinde daha aktifleşir.","Bir anda aklına gelen soruyu ertelemez.","“Son bir kez bakıp çıkacağım” konusunda pek başarılı değildir."],D:["Dışarıdan rahat görünür.","Her şeyi umursamadığını söyler; bazı şeyleri gayet güzel hatırlar.","Gereksiz drama yerine kendi halinde takılmayı tercih eder."],E:["Bir konuyu yüzeysel bırakmak istemez.","Cevap verirken bazen düşündüğünden uzun yazar.","Yanlış bilgi görünce içinden düzeltme isteği gelir."],F:["Ciddi bir konuda bile uygun bir espri bulabilir.","Kaos varsa uzaktan izlemek yerine biraz yaklaşır.","KS'ye girme sebebi bazen sadece eğlenmektir."],G:["Bir süre ortadan kaybolabilir.","Geri döndüğünde sanki hiç gitmemiş gibi devam eder.","Her gün aktif görünmese de neler döndüğünü bilir."],H:["İnsan ilişkilerindeki küçük detayları fark eder.","“Bence burada başka bir şey var” deme ihtimali yüksektir.","Bir olayın görünen kısmıyla yetinmez."],I:["Gereksiz uzatmayı sevmez.","Bir paragraf yerine bir cümleyle anlatabileceğine inanır.","Cevabı kısa olsa da ne demek istediği genellikle nettir."]};
document.getElementById("result").innerHTML=`<div class="resultCard"><div class="emoji">${r.emoji}</div><div class="badge" style="background:#eee;color:#634d66">SONUCUN</div><h2>${r.name}</h2><p>${r.desc}</p><div class="resultTags">${r.tags.map(t=>`<span class="tag">#${t}</span>`).join("")}</div><div class="you"><h3>KS'deki sen 👇</h3>${traits[key].map(x=>`<div class="trait">✓ ${x}</div>`).join("")}</div><button class="share" onclick="copyResult()">📋 Sonucumu Kopyala</button><button class="share secondary" onclick="restart()">↻ Testi Tekrar Çöz</button></div>`;
 window.scrollTo({top:0,behavior:"smooth"});
}
function copyResult(){const r=types[window.currentResultKey];const text=`KS'de Hangi Karaktersin?\\n\\n${r.name}\\n\\n${r.desc}`;if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>alert("Sonucun kopyalandı! ❤️"));}else{alert("Sonucun: "+r.name)}}
function restart(){location.reload()}
</script>
</body>
</html>
